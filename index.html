<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gilz Store</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#07111f;
    color:white;
}

/* NAVBAR */

.navbar{
    width:100%;
    background:#0b1628;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.logo img{
    width:45px;
    height:45px;
    border-radius:50%;
}

.logo h1{
    color:#00eaff;
    font-size:28px;
}

/* MENU */

.menu{
    display:flex;
    gap:20px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.menu a:hover{
    color:#00eaff;
}

/* HERO */

.hero{
    text-align:center;
    padding:50px 20px;
}

.hero h2{
    font-size:50px;
    color:#00eaff;
    margin-bottom:10px;
}

.hero p{
    color:#cfcfcf;
    font-size:18px;
}

/* PRODUCTS */

.products{
    display:flex;
    justify-content:center;
    padding:20px;
}

/* CARD */

.card{
    width:320px;
    background:#0d1b2f;
    border:2px solid #00eaff;
    border-radius:20px;
    padding:20px;
}

/* IMAGE */

.app-img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:15px;
    margin-bottom:15px;
}

/* TITLE */

.card h1{
    margin-bottom:10px;
}

/* TEXT */

.card p{
    color:#cfcfcf;
    margin-bottom:20px;
}

/* BUTTON */

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00eaff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* HIDDEN */

.hidden{
    display:none;
}

/* OPTION */

.option{
    display:block;
    background:#13233c;
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
}

/* EMAIL */

.email-input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#1a2c47;
    color:white;
    font-size:16px;
}

/* CHECKOUT */

.checkout-btn{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00eaff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* ABOUT */

.about{
    padding:50px 20px;
    text-align:center;
}

.about h2{
    color:#00eaff;
    margin-bottom:15px;
}

/* CONTACT */

.contact{
    padding:50px 20px;
    text-align:center;
}

.contact h2{
    color:#00eaff;
    margin-bottom:15px;
}

.contact a{
    color:white;
    text-decoration:none;
    display:block;
    margin-top:10px;
}

.contact a:hover{
    color:#00eaff;
}

/* FOOTER */

.footer{
    text-align:center;
    padding:20px;
    background:#0b1628;
    margin-top:30px;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <!-- LOGO -->

    <div class="logo"
    onclick="window.location.href='#'">

        <img src="gilz.png">

        <h1>Gilz Store</h1>

    </div>

    <!-- MENU -->

    <div class="menu">

        <a href="#">Home</a>

        <a href="#produk">
            Produk
        </a>

        <a href="#about">
            About
        </a>

        <a href="#contact">
            Contact
        </a>

    </div>

</div>

<!-- HERO -->

<div class="hero">

    <h2>Gilz Store</h2>

    <p>
        Jual akun premium murah dan terpercaya
    </p>

</div>

<!-- PRODUCT -->

<div class="products"
id="produk">

    <!-- CARD -->

    <div class="card">

        <!-- IMAGE -->

        <img src="netflix.png"
        class="app-img">

        <!-- TITLE -->

        <h1>Netflix Premium</h1>

        <!-- DESC -->

        <p>
            Streaming premium tanpa iklan.
        </p>

        <!-- BUTTON -->

        <button class="btn"
        onclick="showDetail()">

            Order Now

        </button>

        <!-- DETAIL -->

        <div id="detail"
        class="hidden">

            <label class="option">

                <input
                type="radio"
                name="paket"
                value="1 Bulan - Rp 8K"
                checked>

                1 Bulan - Rp 8K

            </label>

            <label class="option">

                <input
                type="radio"
                name="paket"
                value="2 Bulan - Rp 15K">

                2 Bulan - Rp 15K

            </label>

            <label class="option">

                <input
                type="radio"
                name="paket"
                value="3 Bulan - Rp 20K">

                3 Bulan - Rp 20K

            </label>

            <!-- EMAIL -->

            <input
            type="email"
            class="email-input"
            placeholder="Masukkan Email">

            <!-- CHECKOUT -->

            <button class="checkout-btn"
            onclick="checkout()">

                Checkout

            </button>

        </div>

    </div>

</div>

<!-- ABOUT -->

<div class="about"
id="about">

    <h2>About</h2>

    <p>
        Gilz Store menyediakan berbagai
        akun premium murah dan aman.
    </p>

</div>

<!-- CONTACT -->

<div class="contact"
id="contact">

    <h2>Contact</h2>

    <a href="https://wa.me/6287886783807">

        WhatsApp Admin

    </a>

    <a href="#">

        Instagram Store

    </a>

</div>

<!-- FOOTER -->

<div class="footer">

    © 2026 Gilz Store

</div>

<script>

/* SHOW DETAIL */

function showDetail(){

    document
    .getElementById("detail")
    .classList.toggle("hidden");

}

/* CHECKOUT */

function checkout(){

    let paket =
    document.querySelector(
    'input[name="paket"]:checked'
    ).value;

    let email =
    document.querySelector(
    '.email-input'
    ).value;

    let text =
`Halo Gilz Store

Saya ingin order:

Produk: Netflix Premium
Paket: ${paket}
Email: ${email}`;

    window.location.href =
`https://wa.me/6287886783807?text=${encodeURIComponent(text)}`;

}

</script>

</body>
</html>
